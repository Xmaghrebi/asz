$("#fileScan").onchange = e=>{
  const files=[...e.target.files].slice(0, ai.maxImages||2); e.target.value="";
  const o=scanTarget(); if(!files.length||!o) return; runScan(files,o);
};
async function runScan(files,o){
  const urls=await Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(""); r.readAsDataURL(f);})));
  const sh=sheet(`<h3>Fotos werden ausgelesen</h3><p class="sub">Die erkannten Daten erscheinen gleich zur Kontrolle. Es wird nichts ohne deine Bestätigung übernommen.</p>
    <div class="previews">${urls.map(u=>`<img src="${u}" alt="Foto Fahrzeugausweis">`).join("")}</div><div class="spinner" id="scanStat">Wird ausgewertet …</div>
    <div class="sheet-actions"><button class="btn" data-close>Abbrechen</button></div>`);
  const ctl=new AbortController(); sh.onclose=()=>ctl.abort();
  try{
    const r = await ai.fn.json(FA_PROMPT,{images:files, signal:ctl.signal, cache:false});
    if(!r || !r.felder){ throw {code:"invalid_json"}; }
    if(!Object.values(r.felder).some(f=>f?.wert)){ sh.body.innerHTML=`<h3>Keine Daten erkannt</h3><p class="sub">${esc(r.hinweis||"Auf den Fotos war nichts lesbar. Bitte Fahrzeugausweis flach, vollständig und ohne Spiegelung fotografieren.")}</p><div class="sheet-actions"><button class="btn" data-close>Schliessen</button><button class="btn sig" data-again>Neue Fotos</button></div>`; sh.body.querySelector("[data-again]").onclick=()=>{sh.close();photoCollector(o);}; return; }
    reviewOCR(sh, o, r, urls);
  }catch(err){
    if(err?.code==="cancelled") return;
    sh.body.innerHTML=`<h3>Erkennung nicht möglich</h3><p class="sub">${esc(AI_ERR(err?.code))}</p><div class="sheet-actions"><button class="btn" data-close>Schliessen</button><button class="btn sig" data-again>Neues Foto</button></div>`;
    sh.body.querySelector("[data-again]").onclick=()=>{sh.close();photoCollector(o);};
  }
}
function reviewOCR(sh,o,r,urls){
  const F=r.felder;
  const rows=FA_FIELDS.filter(([k])=>F[k]?.wert).map(([k,label])=>{
    const c=Math.max(0,Math.min(1,+F[k].sicherheit||0)); const low=c<0.75;
    return `<div class="ocr-row"><input type="checkbox" class="box" data-take="${k}" ${c>=0.5?"checked":""} aria-label="${esc(label)} übernehmen" style="margin-top:26px">
    <div class="fld"><label for="o_${k}">${esc(label)} <span class="conf ${low?"low":""}" title="Sicherheit der Erkennung"><i style="--w:${Math.round(c*100)}%;--c:${low?"var(--warn)":"var(--ok)"}"></i>${low?"prüfen":Math.round(c*100)+"%"}</span></label>
    <input id="o_${k}" value="${esc(F[k].wert)}"></div></div>`;}).join("");
  sh.body.innerHTML=`<h3>Erkannte Daten prüfen</h3><p class="sub">Werte bei Bedarf korrigieren. Nur angehakte Felder werden in die Werkstattkarte übernommen.</p>
  <div class="previews">${urls.map(u=>`<img src="${u}" alt="Foto Fahrzeugausweis">`).join("")}</div>
  ${r.hinweis?`<div class="banner info"><span>${esc(r.hinweis)}</span></div>`:""}
  ${rows||`<p class="sub">Es konnten keine Felder gelesen werden.</p>`}
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600;font-size:14px"><input type="checkbox" class="box" id="asKunde" ${!o[kk(o)].name?"checked":""}> Halter/in auch als ${o.kind==="einsatz"?"Auftraggeber":"Kunde"} eintragen</label>
  <div class="sheet-actions"><button class="btn" data-close>Verwerfen</button><button class="btn sig" id="take">Daten übernehmen</button></div>`;
  $("#take",sh.body).onclick=async ()=>{
    const val=k=>$(`#o_${k}`,sh.body)?.value.trim(); const on=k=>$(`[data-take="${k}"]`,sh.body)?.checked && val(k);
    const map={kilometerstand:"fz.km",kontrollschild:"fz.kontrollschild",marke_typ:"fz.marke",fahrgestellnummer:"fz.vin",stammnummer:"fz.stammnr",erste_inverkehrsetzung:"fz.inverkehr",farbe:"fz.farbe",treibstoff:"fz.treibstoff",hubraum:"fz.hubraum",leistung:"fz.leistung",gesamtgewicht:"fz.gesamtgewicht",letzte_pruefung:"fz.mfk"};
    const taken=[]; o.fz.quelleKI=[];
    for(const [k,p] of Object.entries(map)){ if(on(k)){ setPath(o,p,k==="fahrgestellnummer"?normVin(val(k)):k==="kilometerstand"?val(k).replace(/\D/g,""):val(k)); o.fz.quelleKI.push(p); taken.push(k); } }
    if(on("typengenehmigung")) o.fz.typengenehmigung=val("typengenehmigung");
    if(on("fahrzeugart")) o.fz.fahrzeugart=val("fahrzeugart");
    if(on("leergewicht")) o.fz.leergewicht=val("leergewicht");
    if(on("sitzplaetze")) o.fz.sitzplaetze=val("sitzplaetze");
    if(on("karosserie")) o.fz.karosserie=val("karosserie");
    if(on("halter_name")){ o.fz.halter={name:val("halter_name"),adresse:on("halter_adresse")?val("halter_adresse"):""}; if($("#asKunde",sh.body).checked){ o[kk(o)].name=o.fz.halter.name; o.fz.quelleKI.push(kk(o)+".name"); } }
    logEv(o,`Fotos ausgewertet – ${taken.length+(on("halter_name")?1:0)} Felder übernommen`);
    sh.close(); await afterScan(o); toast("Daten aus den Fotos übernommen");
  };
}
$("#fileTacho").onchange = async e=>{
  const f=e.target.files[0]; e.target.value=""; const o=cur(); if(!f||!o) return;
  const btn=document.querySelector('[data-act="tacho"]'); if(btn){btn.disabled=true;btn.textContent="Liest …";}

/* ================= Sheet & Unterschrift ================= */
function sheet(html){
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(bg);
  const api={ body:bg.firstChild, onclose:null, close(){ bg.remove(); api.onclose?.(); document.removeEventListener("keydown",kd);} };
  const kd=e=>{ if(e.key==="Escape") api.close(); }; document.addEventListener("keydown",kd);
  bg.addEventListener("click",e=>{ if(e.target===bg || e.target.closest("[data-close]")) api.close(); });
  setTimeout(()=>bg.querySelector("button,input")?.focus(),30);
  return api;
}
function signPad(o,who){
  const label= who==="mech"?"Mechaniker":"Endkontrolle";
  const sh=sheet(`<h3>Unterschrift ${label}</h3><p class="sub">${who==="mech"?"Bestätigt, dass alle Arbeiten und der Mehraufwand ausgeführt wurden.":"Bestätigt die Endkontrolle des Fahrzeugs."}</p>
  <div class="fld" style="margin-bottom:10px"><label for="sgName">Name</label><input id="sgName" list="mechs" value="${esc(o[who].name)}"></div>
  <canvas class="sigpad" id="pad" aria-label="Unterschriftsfeld"></canvas>
  <div class="sheet-actions"><button class="btn ghost" id="clr">Löschen</button><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="ok">Unterschrift speichern</button></div>`);
  const c=$("#pad",sh.body), ctx=c.getContext("2d"); const r=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr; ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle="#111";
  let drawing=false, has=false;
  const pos=e=>{const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{drawing=true;has=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));};
  c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke();};
  c.onpointerup=()=>drawing=false;
  $("#clr",sh.body).onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false;};
  $("#ok",sh.body).onclick=()=>{
    const n=$("#sgName",sh.body).value.trim(); if(!n){toast("Bitte Namen eintragen.");return;} if(!has){toast("Bitte im Feld unterschreiben.");return;}
    const out=document.createElement("canvas"); out.width=480; out.height=Math.round(480*c.height/c.width); out.getContext("2d").drawImage(c,0,0,out.width,out.height);
    o[who].sig=out.toDataURL("image/png"); o[who].name=n; if(!o[who].datum) o[who].datum=new Date().toISOString().slice(0,10);
    logEv(o,`Unterschrift ${label}: ${n}`);
    if(who==="ek" && STATUS.indexOf(o.status)<STATUS.indexOf("Kontrolle")) { o.status="Kontrolle"; logEv(o,"Status → Kontrolle"); }
    scheduleSave(o); sh.close(); refreshKeep(o);
  };
}

function isNight(iso){ const d=new Date(iso); const h=d.getHours(), wd=d.getDay(); return h>=22||h<6||wd===0||wd===6; }
const sgMode = e => e.depot?.sgMode || "Berechnen";
const sgPreis = e => (e.depot?.sgPreis===""||e.depot?.sgPreis==null) ? CFG.standgebuehrTag : +e.depot.sgPreis;
function depotDays(e){
  if(!e.depot?.einfahrt) return 0;
  const endIso=e.depot.ausfahrt||e.depot.abholung; const end=endIso?new Date(endIso):new Date();
  const h=(end-new Date(e.depot.einfahrt))/36e5 - CFG.depotFreiStd;

}

function calcE(e){

const zNorm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/strasse\b/g,"str").replace(/str\.?(?=\s|\d|$)/g,"str").replace(/[^a-z0-9]+/g," ").trim();

function zSearch(q, e, limit=6){
  const toks=zNorm(q).split(" ").filter(Boolean); if(!toks.length) return [];
  return S.zessionen.map(z=>{const h=zHay(z); const hit=toks.filter(t=>h.includes(t)).length; return {z,hit};})
    .filter(r=>r.hit===toks.length).map(r=>r.z)
    .sort((a,b)=>(zGueltig(b,e)-zGueltig(a,e)) || (b.typ==="Dauerhafte Zession")-(a.typ==="Dauerhafte Zession")).slice(0,limit);
}
function zSuggest(e){

}

function eWarnings(e){
  const w=[], si=E_STATUS.indexOf(e.status);
  if(!e.dienst) w.push("Dienstleistung wählen");
  if(isFP(e)||isPB(e)){
    if(!e.fp.liegenschaft) w.push("Liegenschaft fehlt");
    if(!e.fz.kontrollschild) w.push("Kontrollschild fehlt");
  } else if(e.dienst && !e.ort) w.push("Einsatzort fehlt");
  if(isFP(e)){
    if(!e.fp.berechtigung) w.push("Berechtigung für diesen Fall ist nicht bestätigt");
    const z=curZ(e); if(!z) w.push("Keine Zession zugewiesen"); else if(!zGueltig(z,e)) w.push(zAbgelaufen(z)?"Zugewiesene Zession ist abgelaufen":"Einzelzession wurde bereits verwendet");
  }
  if(si>=1 && !e.fahrer) w.push("Kein Fahrer zugewiesen");
  if(isFP(e) && si>=E_STATUS.indexOf("Transport") && !fpItems(e).length && !e.ablauf?.leer) w.push("Leistungen vom Fahrer noch nicht erfasst");
  if(e.depot && !e.depot.stellplatz) w.push("Stellplatz im Depot fehlt");

  return w;
}

      <dt>Fahrzeug</dt><dd>${esc(e.fz.kontrollschild||"–")} ${esc(e.fz.marke)} ${esc(e.fz.farbe)}</dd>
      ${isFP(e)?`<dt>Berechtigung</dt><dd>${e.fp.berechtigung?"Bestätigt":"Nicht bestätigt"} · ${curZ(e)?esc(curZ(e).typ+" "+curZ(e).nr):"Keine Zession"}</dd>`:""}

async function saveDraft(){
  const e=S.draft; e.nr=nextENr(); e.created=new Date().toISOString();
  if(e.sofort) e.termin=nowLocal();
  e.status=e.fahrer?"Zugewiesen":"Pendent";
  logEv(e,`Einsatz erfasst (${e.dienst})`); if(e.fahrer) logEv(e,`Zugewiesen an ${e.fahrer}${e.einsatzfz?" · "+e.einsatzfz:""}`);
  S.einsaetze.push(e); S.draft=null;
  await upsertVehicle(e);
  try{ await store.put("einsaetze",e); toast(e.fahrer?`Einsatz ${e.nr} an ${e.fahrer} zugewiesen`:`Einsatz ${e.nr} pendent gespeichert`); }catch(err){ toast("Einsatz konnte nicht gespeichert werden."); }
  await uploadDraftFiles(e);
  S.backTo="dispo"; go("einsatz",e.id);
}

  const night=isNight((!e.sofort&&e.termin)?e.termin:e.created);
  return `<div class="lst">${CFG.fpLeistungen.map(x=>{const q=+(e.lst?.[x.k]||0);
    const sub=chf(x.p)+(x.qty?" pro Stück":"")+(x.k==="nacht"&&night&&!q?" · Einsatz fällt in Nacht/Wochenende":"");
    return x.qty
      ?`<div class="lst-row ${q?"on":""}"><span><b>${esc(x.l)}</b><small>${sub}</small></span><span class="stepper"><button type="button" data-lq="${x.k}:-1" aria-label="${esc(x.l)} weniger" ${q?"":"disabled"}>−</button><output aria-live="polite">${q}</output><button type="button" data-lq="${x.k}:1" aria-label="${esc(x.l)} mehr">+</button></span></div>`
      :`<label class="lst-row ${q?"on":""}"><span><b>${esc(x.l)}</b><small class="${x.k==="nacht"&&night&&!q?"warnt":""}">${sub}</small></span><input type="checkbox" class="box" data-lt="${x.k}" ${q?"checked":""}></label>`;}).join("")}</div>`;
}
function setLeistung(e,k,q){
  const x=CFG.fpLeistungen.find(i=>i.k===k); e.lst=e.lst||{};
  const old=+(e.lst[k]||0); q=Math.max(0,q); if(q===old) return;
  if(q) e.lst[k]=q; else delete e.lst[k];
  if(q && x.excl && e.lst[x.excl]){ delete e.lst[x.excl]; }
  logEv(e, q>old?`Leistung erfasst: ${x.l}${x.qty?` (${q})`:""}`:`Leistung entfernt: ${x.l}${x.qty&&q?` (${q})`:""}`);
}
function refreshE(e){ const y=window.scrollY, aid=document.activeElement?.id; CTX=e; $("#view").innerHTML=einsatzHTML(e); $("#title").textContent=eTitle(e); window.scrollTo(0,y); if(aid) document.getElementById(aid)?.focus(); }
function patchE(e){ CTX=e; const tmp=document.createElement("div"); tmp.innerHTML=einsatzHTML(e); [".open-points",".money",'[id="h_verrechnet"]','[id="sgRes"]'].forEach(s=>{const a=$(s),b=$(s,tmp); if(a&&b) a.replaceWith(b);}); }

function setEStatus(e,s){
  const from=e.status; if(from===s) return;
  const ahead=E_STATUS.indexOf(s)>E_STATUS.indexOf(from);
  if(ahead && E_STATUS.indexOf(s)>=1 && !e.fahrer){ toast("Zuerst einen Fahrer zuweisen."); return; }
  if(ahead && isFP(e) && E_STATUS.indexOf(s)>=E_STATUS.indexOf("Transport") && (!e.fp.berechtigung || !zGueltig(curZ(e),e))){ toast("Abschleppen erst mit bestätigter Berechtigung und Zession."); return; }
  if(ahead && isFP(e) && s==="Abgeschlossen" && !fpItems(e).length && !e.ablauf?.leer){ toast("Zuerst die Leistungen erfassen."); return; }
  if(s==="Pendent" && e.fahrer){ logEv(e,`Zuweisung an ${e.fahrer} aufgehoben`); e.fahrer=""; }
  e.status=s; if(s==="Abgeschlossen") e.closed=new Date().toISOString();
  logEv(e,`Status: ${from} → ${s}`); scheduleSave(e); refreshE(e);
  if(s==="Abgeschlossen") toast(inDepot(e)?"Einsatz abgeschlossen – Fahrzeug bleibt im Depot":"Einsatz abgeschlossen");
}
function bindEinsatz(e, draft){
  const v=$("#view"), save=()=>{ if(!draft) scheduleSave(e); }, re=()=> draft?refreshW():refreshE(e);
  v.oninput = ev=>{
    const el=ev.target;
    if(el.id==="zsQ"){ $("#zsRes").innerHTML=zResHTML(e,el.value); return; }
    if(!el.dataset.bind || el.tagName==="SELECT") return;
    setPath(e, el.dataset.bind, el.type==="checkbox"?el.checked:el.value);
    e.fz.quelleKI=(e.fz.quelleKI||[]).filter(p=>p!==el.dataset.bind); el.closest(".fld")?.classList.remove("ai");
    if(el.dataset.bind==="fp.berechtigung" && el.checked) logEv(e,"Berechtigung für diesen Fall bestätigt");
    save(); if(el.type==="checkbox") re();
  };
  v.onchange = async ev=>{
    const el=ev.target; const b=el.dataset.bind; if(!b) return;
    if(el.tagName==="SELECT"){
      const old=getPath(e,b); setPath(e,b,el.value);
      if(b==="fahrer" && needsReview(e) && el.value){ setPath(e,b,old); toast("Zuerst den Auftrag prüfen."); re(); return; }
      if(b==="fahrer"){ if(el.value){ logEv(e,`Zugewiesen an ${el.value}`); if(e.status==="Pendent") { e.status="Zugewiesen"; logEv(e,"Status: Pendent → Zugewiesen"); } } else if(old){ logEv(e,`Zuweisung an ${old} aufgehoben`); if(activeE(e)) e.status="Pendent"; } }
      if(b==="halterErm.status"){ logEv(e,`Halterermittlung: ${el.value}`); if(el.value==="Ermittelt" && !e.halterErm.gebuehr && CFG.halterGebuehr) e.halterErm.gebuehr=CFG.halterGebuehr; }
      if(b==="dienst") logEv(e,`Dienstleistung geändert: ${old} → ${el.value}`);
      save(); re(); return;
    }
    if(b==="auftraggeber.name" && linkKunde(e,"auftraggeber")){ save(); re(); return; }
    if(isFP(e) && !curZ(e) && ["auftraggeber.name","fp.liegenschaft"].includes(b)){ const r=$("#zsRes"); if(r && !$("#zsQ")?.value) r.innerHTML=zResHTML(e,""); }
    if(!draft && b==="depot.einfahrt"){ save(); re(); return; }
    if(!draft && ["fz.kontrollschild","fz.vin","fz.km"].includes(b)){ await upsertVehicle(e); save(); }
    if(b==="fz.kontrollschild" && !draft) $("#title").textContent=eTitle(e);
    if(!draft) patchE(e);
  };
  v.onclick = async ev=>{
    const lt=ev.target.closest("input[data-lt]"); if(lt){ setLeistung(e,lt.dataset.lt,lt.checked?1:0); save(); re(); return; }
    const bt=ev.target.closest("button"); if(!bt) return;
    if(bt.dataset.zassign){ const z=S.zessionen.find(x=>x.id===bt.dataset.zassign); if(z){ assignZ(e,z,draft); save(); re(); toast(`Zession ${z.nr} zugewiesen`);} return; }
    if(bt.dataset.zedit){ zSheet(S.zessionen.find(x=>x.id===bt.dataset.zedit),null,()=>re()); return; }
    if(bt.dataset.act==="zRemove"){ const z=curZ(e); if(z?.typ==="Einzelzession" && z.usedBy===e.id){ z.usedBy=""; store.put("zessionen",z).catch(()=>{}); } e.fp.zessionId=""; e.fp.zession=""; logEv(e,"Zessionszuweisung entfernt"); save(); re(); return; }
    if(bt.dataset.act==="zNew"){ zSheet(null,{typ:"Dauerhafte Zession",auftraggeber:{name:e.auftraggeber.name,telefon:e.auftraggeber.telefon,email:""},liegenschaften:e.fp.liegenschaft?[e.fp.liegenschaft]:[]},z=>{ if(z){ assignZ(e,z,draft); save(); } re(); }); return; }
    if(bt.dataset.lq){ const [k,d]=bt.dataset.lq.split(":"); setLeistung(e,k,+(e.lst?.[k]||0)+(+d)); save(); re(); return; }
    if(bt.dataset.dienst){ e.dienst=bt.dataset.dienst; S.wstep=2; refreshW(); window.scrollTo(0,0); return; }
    if(bt.dataset.wstep){ S.wstep=+bt.dataset.wstep; refreshW(); window.scrollTo(0,0); return; }
    if(bt.dataset.pickfahrer!==undefined){ e.fahrer=bt.dataset.pickfahrer; if(!e.fahrer) e.einsatzfz=""; refreshW(); return; }
    if(bt.dataset.prio){ e.prio=bt.dataset.prio; save(); re(); return; }
    if(bt.dataset.sofort){ e.sofort=bt.dataset.sofort==="Sofort"; if(!e.sofort&&!e.termin) e.termin=nowLocal(); re(); return; }
    if(bt.dataset.sgmode){ e.depot.sgMode=bt.dataset.sgmode; if(bt.dataset.sgmode==="Berechnen"&&!e.depot.abholung) e.depot.abholung=nowLocal(); logEv(e,`Standgebühren: ${bt.dataset.sgmode}`); save(); re(); return; }
    if(bt.dataset.zahlart){ e.depot.zahlart=bt.dataset.zahlart; save(); re(); return; }
    if(bt.dataset.estatus){ setEStatus(e,bt.dataset.estatus); return; }
    const a=bt.dataset.act;
    if(a==="saveE") return saveDraft();
    if(a==="scanFA"){ if(await ensureAI()) photoCollector(e); }
    if(a==="scanPlate"){ if(await ensureAI()) $("#filePlate").click(); }
    if(a==="depotIn"){ e.depot={stellplatz:"",schluessel:"",einfahrt:nowLocal(),abholung:"",zustand:"",an:"",ausweis:false,zahlart:"TWINT",sgMode:"Berechnen",sgPreis:"",sgBetrag:"",ausfahrt:"",sig:"",betrag:0}; logEv(e,"Ins Depot aufgenommen"); await upsertVehicle(e); save(); re(); }
    if(a==="handover") handover(e);
    if(a==="toWS") toWerkstatt(e);
    if(a==="cancelE"){ if(confirm(`Einsatz ${e.nr} stornieren?`)){ const f=e.status; e.status="Storniert"; logEv(e,`Storniert (vorher ${f})`); save(); re(); } }
    if(a==="delE"){ if(confirm(`Einsatz ${e.nr} endgültig löschen?`)){ await store.del("einsaetze",e.id).catch(()=>{}); S.einsaetze=S.einsaetze.filter(x=>x.id!==e.id); toast("Einsatz gelöscht"); go(S.backTo||"dispo"); } }
  };
}
function handover(e){
  const d=e.depot, C=calcE(e), betrag=e.verrechnet===""||e.verrechnet==null?C.total:+e.verrechnet;
  if(!d.an){ toast("Bitte eintragen, wer das Fahrzeug abholt."); $('[id="f_depot.an"]')?.focus(); return; }
  if(!d.ausweis){ toast("Bitte zuerst die Identität prüfen."); return; }
  if(isFP(e) && !fpItems(e).length){ toast("Zuerst die Leistungen erfassen."); return; }
  const sh=sheet(`<h3>Herausgabe ${esc(e.fz.kontrollschild)}</h3><p class="sub">${esc(d.an)} bestätigt den Erhalt des Fahrzeugs und die Zahlung von <b>${chf(betrag)}</b> per ${esc(d.zahlart)}.</p>
    <canvas class="sigpad" id="pad" aria-label="Unterschriftsfeld"></canvas>
    <div class="sheet-actions"><button class="btn ghost" id="clr">Löschen</button><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="ok">Herausgabe abschliessen</button></div>`);
  const pad=makePad($("#pad",sh.body)); $("#clr",sh.body).onclick=pad.clear;
  $("#ok",sh.body).onclick=()=>{
    if(!pad.has()){ toast("Bitte im Feld unterschreiben."); return; }
    d.sig=pad.png(); d.ausfahrt=new Date().toISOString(); d.betrag=betrag;
    d.standgebuehr=C.stand; logEv(e,`Herausgegeben an ${d.an} · ${d.zahlart} · ${chf(betrag)}${C.stand?` (inkl. Standgebühr ${chf(C.stand)})`:""}`);
    if(e.status!=="Abgeschlossen"){ e.status="Abgeschlossen"; e.closed=d.ausfahrt; logEv(e,"Status → Abgeschlossen"); }
    scheduleSave(e); sh.close(); refreshE(e); toast("Fahrzeug herausgegeben");
  };
}
function makePad(c){
  const ctx=c.getContext("2d"), r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr; ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle="#111";
  let dr=false, has=false; const pos=ev=>{const b=c.getBoundingClientRect(); return [ev.clientX-b.left,ev.clientY-b.top];};
  c.onpointerdown=ev=>{dr=true;has=true;c.setPointerCapture(ev.pointerId);ctx.beginPath();ctx.moveTo(...pos(ev));};
  c.onpointermove=ev=>{if(!dr)return;ctx.lineTo(...pos(ev));ctx.stroke();};
  c.onpointerup=()=>dr=false;
  return { has:()=>has, clear:()=>{ctx.clearRect(0,0,c.width,c.height);has=false;},
    png:()=>{const o=document.createElement("canvas"); o.width=480; o.height=Math.round(480*c.height/c.width); o.getContext("2d").drawImage(c,0,0,o.width,o.height); return o.toDataURL("image/png");} };
}
async function toWerkstatt(e){
  const o=newOrder();
  o.quelle = e.dienst==="Pannen"?"Panne":e.dienst==="Unfälle/Bergungen"?"Unfall":"Abschleppauftrag";
  o.fz = {...o.fz, ...structuredClone(e.fz), quelleKI:[]};
  o.kunde.name = e.fz.halter?.name || e.auftraggeber.name; if(!e.fz.halter) o.kunde.telefon=e.auftraggeber.telefon;
  o.einsatzId=e.id; o.vehId=e.vehId; o.schluessel=e.depot?.schluessel||"";
  o.zustand = [e.notiz, e.depot?.zustand].filter(Boolean).join(" · ");
  logEv(o,`Aus Abschleppeinsatz ${e.nr} übernommen (${e.dienst})`);
  S.orders.push(o); e.werkstattId=o.id; logEv(e,`An Werkstatt übergeben (${o.nr})`);
  try{ await store.put("auftraege",o); }catch(err){ toast("Werkstattauftrag konnte nicht gespeichert werden."); }
  scheduleSave(e); toast(`Werkstattauftrag ${o.nr} eröffnet`); go("order",o.id);
}

const PLATE_PROMPT = `Auf dem Foto ist ein parkiertes Fahrzeug. Lies das Kontrollschild. Schweizer Schilder: Kantonskürzel + Nummer, z. B. "ZH 123456". Ausländische Schilder sind möglich.
Marke/Modell und Farbe nur angeben, wenn klar erkennbar. Nie raten.
Antworte NUR mit JSON: {"kennzeichen": "", "land": "CH", "sicherheit": 0.0, "marke": "", "farbe": "", "hinweis": ""}. Nicht lesbar: kennzeichen "" und sicherheit 0.`;
$("#filePlate").onchange = async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; const e=scanTarget(); if(!f||!e) return;
  const url=await new Promise(res=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(""); r.readAsDataURL(f);});
  const sh=sheet(`<h3>Kennzeichen wird gelesen</h3><div class="previews"><img src="${url}" alt="Foto Fahrzeug"></div><div class="spinner">Wird ausgewertet …</div><div class="sheet-actions"><button class="btn" data-close>Abbrechen</button></div>`);

    const c=Math.round((+r.sicherheit||0)*100), low=c<75;
    sh.body.innerHTML=`<h3>Erkanntes Kennzeichen prüfen</h3><div class="previews"><img src="${url}" alt="Foto Fahrzeug"></div>
      ${r.hinweis?`<div class="banner info"><span>${esc(r.hinweis)}</span></div>`:""}
      <div class="fld"><label for="pl_k">Kontrollschild <span class="conf ${low?"low":""}"><i style="--w:${c}%;--c:${low?"var(--warn)":"var(--ok)"}"></i>${low?"prüfen":c+"%"}</span></label><input id="pl_k" value="${esc(r.kennzeichen)}"></div>
      <div class="grid g2" style="margin-top:10px"><div class="fld"><label for="pl_m">Marke / Modell</label><input id="pl_m" value="${esc(r.marke||"")}"></div><div class="fld"><label for="pl_f">Farbe</label><input id="pl_f" value="${esc(r.farbe||"")}"></div></div>
      <div class="sheet-actions"><button class="btn" data-close>Verwerfen</button><button class="btn sig" id="plOk">Übernehmen</button></div>`;
    $("#plOk",sh.body).onclick=async ()=>{
      const k=$("#pl_k",sh.body).value.trim(), m=$("#pl_m",sh.body).value.trim(), fa=$("#pl_f",sh.body).value.trim();
      e.fz.kontrollschild=k; e.fz.quelleKI=[...new Set([...(e.fz.quelleKI||[]),"fz.kontrollschild"])];
      if(m&&!e.fz.marke){ e.fz.marke=m; e.fz.quelleKI.push("fz.marke"); } if(fa&&!e.fz.farbe){ e.fz.farbe=fa; e.fz.quelleKI.push("fz.farbe"); }
      if(S.view!=="wizard") logEv(e,`Kennzeichen aus Foto erkannt: ${k}`);
      sh.close(); await afterScan(e);
    };
  }catch(err){ if(err?.code==="cancelled") return; sh.body.innerHTML=`<h3>Erkennung nicht möglich</h3><p class="sub">${esc(AI_ERR(err?.code))}</p><div class="sheet-actions"><button class="btn" data-close>Schliessen</button></div>`; }
};

const logoHTML = (cls="") => `<picture class="logo ${cls}"><source srcset="${LOGO_L}" media="(prefers-color-scheme: dark)"><img src="${LOGO_D}" alt="ASZ Mobilitätszentrum"></picture>`;
const ROLLEN = ["Geschäftsleitung","Disponent","Fahrer","Mechaniker","Buchhaltung"];
const ACCESS = {"Geschäftsleitung":["ad","ws","shared","team"],"Disponent":["ad","shared"],"Fahrer":["ad","shared"],"Mechaniker":["ws","shared"],"Buchhaltung":["ad","ws","shared"]};
const VIEW_AREA = {personal:"team",ma:"team",kunden:"shared",kunde:"shared",settings:"team",dispo:"ad",depot:"ad",zessionen:"ad",einsatz:"ad",wizard:"ad",orders:"ws",order:"ws",vehicles:"shared",team:"team"};
const AUTH = { mode:"local", uid:null, admin:false, owner:false, me:null, staff:[], regs:[], screen:"start" };
const normMail = m => String(m||"").trim().toLowerCase();
const initials = m => ((m?.vorname||"")[0]||"")+((m?.nachname||"")[0]||"") || "?";
const fullName = m => [m?.vorname,m?.nachname].filter(Boolean).join(" ");
function canArea(a){ if(!a) return true; if(a==="team") return AUTH.admin; return (ACCESS[AUTH.me?.rolle]||[]).includes(a); }

/* ---------- Passwort-Hash (PBKDF2, SHA-256) ---------- */
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function pwHash(pw, saltB64, iter=210000){
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter}, key, 256);
  return {salt:b64(salt), hash:b64(new Uint8Array(bits)), iter};
}
async function pwCheck(pw, rec){ if(!rec?.hash) return false; const h=await pwHash(pw, rec.salt, rec.iter); let d=0; for(let i=0;i<Math.max(h.hash.length,rec.hash.length);i++) d|=(h.hash.charCodeAt(i)||0)^(rec.hash.charCodeAt(i)||0); return d===0; }

/* ---------- Zugangsdaten: privat pro Konto ---------- */
const localAuths = () => { try{ return JSON.parse(localStorage.getItem("asz_local_auth")||"[]"); }catch(e){ return []; } };
async function authGet(email){
  if(AUTH.mode==="db"){
    const s = await store.db.collection(`data/users/${AUTH.uid}`).doc("auth").get().catch(()=>null);
    const a = s?.exists ? s.data() : null;
    if(!a) return {none:true};
    return email===undefined || a.email===normMail(email) ? {...a, id:AUTH.uid} : {mismatch:true};
  }
  const a = localAuths().find(x=>x.email===normMail(email));
  return a || {none:true};
}
async function authPut(rec){
  if(AUTH.mode==="db"){ const {id,...body}=rec; await store.db.collection(`data/users/${AUTH.uid}`).doc("auth").set(body); return; }
  const list=localAuths().filter(x=>x.id!==rec.id); list.push(rec);
  localStorage.setItem("asz_local_auth", JSON.stringify(list));
}
/* ---------- Sitzung ---------- */
function sessionGet(){ try{ const s=JSON.parse(localStorage.getItem("asz_session")||"null"); return s && s.exp>Date.now() ? s : null; }catch(e){ return null; } }
function sessionSet(id, remember){ try{ localStorage.setItem("asz_session", JSON.stringify({id, exp:Date.now()+(remember?30*864e5:12*36e5)})); }catch(e){} }
function sessionClear(){ try{ localStorage.removeItem("asz_session"); }catch(e){} }
/* ---------- Fehlversuche ---------- */
function lockInfo(){ try{ return JSON.parse(localStorage.getItem("asz_lock")||'{"n":0,"until":0}'); }catch(e){ return {n:0,until:0}; } }
function lockFail(){ const l=lockInfo(); l.n++; if(l.n>=5){ l.until=Date.now()+60000; l.n=0; } try{ localStorage.setItem("asz_lock",JSON.stringify(l)); }catch(e){} }
function lockReset(){ try{ localStorage.removeItem("asz_lock"); }catch(e){} }

async function loadStaff(){
  AUTH.staff = await store.all("mitarbeiter");
  AUTH.regs = await store.all("registrierungen");
}
function applyStaff(){
  const aktiv = AUTH.staff.filter(m=>m.aktiv);
  const fahrer = aktiv.filter(m=>m.rolle==="Fahrer").map(fullName);
  const mech = aktiv.filter(m=>m.rolle==="Mechaniker").map(fullName);
  if(fahrer.length) CFG.fahrer = fahrer;
  if(mech.length) CFG.mechaniker = mech;
}
function applyAccess(){
  document.querySelectorAll("[data-area]").forEach(el=>{ el.hidden = !canArea(el.dataset.area); });
  const me=AUTH.me;
  ["#meBtn","#meSide"].forEach(s=>{ const b=$(s); if(!b) return; b.hidden=!me; });
  if(me){ $("#meBtn").textContent=initials(me).toUpperCase(); $("#meSideName").textContent=fullName(me); $("#meSideRole").textContent=me.rolle; $("#meSideAv").textContent=initials(me).toUpperCase(); }
}

/* ---------- Start ---------- */
async function authInit(){
  let user=null; try{ user = await (window.claude?.use ? claude.use("user") : null); }catch(e){ user=null; }
  AUTH.uid = user ? await user.id() : null;
  AUTH.mode = (store.db && AUTH.uid) ? "db" : "local";
  if(AUTH.mode==="db"){ AUTH.owner = await user.isOwner(); AUTH.admin = await user.canEdit(); }
  await loadStaff();
  const s=sessionGet();
  if(s && (AUTH.mode==="local" || s.id===AUTH.uid)){
    const a = AUTH.mode==="db" ? await authGet() : localAuths().find(x=>x.id===s.id);
    if(a && !a.none){ return afterLogin(s.id, false); }
  }
  authScreen("start");
}
async function afterLogin(id, fresh){
  await loadStaff();
  const m = AUTH.staff.find(x=>x.id===id);
  if(AUTH.mode==="local") AUTH.admin = m?.rolle==="Geschäftsleitung" && m.aktiv;
  if(m && m.aktiv){ AUTH.me=m; AUTH.id=id; return enterApp(fresh); }
  AUTH.id=id; AUTH.me=null;
  const r = AUTH.regs.find(x=>x.id===id);
  authScreen(m && !m.aktiv ? "disabled" : r?.status==="abgelehnt" ? "rejected" : "pending", r||m);
}
async function enterApp(fresh){
  document.body.classList.remove("locked"); const au=$("#auth"); au.hidden=true; au.innerHTML="";
  await loadSettings(); applyStaff(); applyAccess();
  S.orders = (await store.all("auftraege")).map(o=>({mehr:[],teile:[],log:[],...o}));
  S.vehicles = await store.all("fahrzeuge");
  S.einsaetze = await store.all("einsaetze");

function authErr(msg){ const e=$("#err"); if(e){ e.textContent=msg; e.classList.toggle("on",!!msg); } }
function busy(form,on,label){ const b=form.querySelector('[type="submit"]'); if(!b) return; if(on){ b.dataset.l=b.textContent; b.textContent=label; b.disabled=true; } else { b.textContent=b.dataset.l||b.textContent; b.disabled=false; } }
function pwProblems(pw){ return {len:pw.length>=8, num:/\d/.test(pw), let:/[a-zäöüA-ZÄÖÜ]/.test(pw)}; }

/* ---------- Start-Login für den Besitzer (Ersteinrichtung / Notzugang) ---------- */
const START_LOGIN = {email:"admin@a-szh.ch", salt:"GjqduIzjofC6qQP+RUVbKw==", hash:"zzasJIRYgh5klKr+C+WHkwk1KSmpVBV+qpLg8IS/yB0=", iter:210000};
async function authMine(){ if(AUTH.mode==="db") return authGet(); return localAuths().find(x=>x.id===AUTH.id) || {none:true}; }
async function startLogin(mail, pw){
  if(normMail(mail)!==START_LOGIN.email || !(await pwCheck(pw, START_LOGIN))) return null;
  if(AUTH.mode==="db" && !AUTH.owner) return "notowner";
  if(AUTH.mode==="local" && localAuths().some(a=>!a.start)) return "notowner";
  let id;
  if(AUTH.mode==="db"){ id=AUTH.uid; }
  else { const gl=AUTH.staff.find(m=>m.rolle==="Geschäftsleitung" && m.aktiv); id=gl?.id || uid(); }
  await authPut({id, email:START_LOGIN.email, salt:START_LOGIN.salt, hash:START_LOGIN.hash, iter:START_LOGIN.iter, start:true, created:new Date().toISOString()});
  const ex=AUTH.staff.find(m=>m.id===id);
  if(!ex || !ex.aktiv || ex.rolle!=="Geschäftsleitung"){
    await store.put("mitarbeiter", {...(ex||{vorname:"Oli", nachname:"M", telefon:"", created:new Date().toISOString()}), id, email:ex?.email||START_LOGIN.email, rolle:"Geschäftsleitung", aktiv:true, freigegeben:new Date().toISOString()});
  }
  return id;
}
function bindAuth(name){
  const au=$("#auth");
  au.onclick = async ev=>{
    const eye=ev.target.closest("[data-eye]"); if(eye){ const i=$("#"+eye.dataset.eye); const show=i.type==="password"; i.type=show?"text":"password"; eye.setAttribute("aria-label",show?"Passwort verbergen":"Passwort anzeigen"); eye.classList.toggle("on",show); return; }
    const r=ev.target.closest("[data-role]"); if(r){ au.querySelectorAll("[data-role]").forEach(x=>x.setAttribute("aria-checked",x===r)); return; }
    const a=ev.target.closest("[data-auth]"); if(!a) return;
    const t=a.dataset.auth;
    if(t==="logout") return logout();
    if(t==="recheck"){ a.disabled=true; a.textContent="Wird geprüft …"; return afterLogin(AUTH.id,true); }
    authScreen(t);
  };
  if(name==="register"){
    $("#rg_pw").addEventListener("input",ev=>{ const p=pwProblems(ev.target.value); document.querySelectorAll("#pwRules li").forEach(li=>li.classList.toggle("ok",p[li.dataset.r])); });
    $("#fReg").onsubmit = async ev=>{
      ev.preventDefault(); authErr("");
      const f=ev.target, v=id=>$("#"+id).value.trim();
      const vn=v("rg_vn"), nn=v("rg_nn"), mail=normMail(v("rg_mail")), tel=v("rg_tel"), pw=$("#rg_pw").value, pw2=$("#rg_pw2").value;
      const rolle=au.querySelector('[data-role][aria-checked="true"]')?.dataset.role;
      if(!vn||!nn) return authErr("Bitte Vor- und Nachnamen eintragen.");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return authErr("Bitte eine gültige E-Mail eintragen.");
      if(!rolle) return authErr("Bitte eine Rolle wählen.");
      const p=pwProblems(pw); if(!p.len||!p.num||!p.let) return authErr("Das Passwort erfüllt noch nicht alle Regeln.");
      if(pw!==pw2) return authErr("Die Passwörter stimmen nicht überein.");
      if(!$("#rg_ok").checked) return authErr("Bitte der Speicherung deiner Angaben zustimmen.");
      busy(f,true,"Konto wird erstellt …");
      try{
        const ex = AUTH.mode==="db" ? await authGet() : await authGet(mail);
        if(!ex.none){ busy(f,false); return authErr(AUTH.mode==="db"?"Für dein Konto besteht bereits eine Registrierung. Bitte anmelden.":"Diese E-Mail ist bereits registriert. Bitte anmelden."); }
        const id = AUTH.mode==="db" ? AUTH.uid : uid();
        const h = await pwHash(pw);
        await authPut({id, email:mail, ...h, created:new Date().toISOString()});
        const firstLocal = AUTH.mode==="local" && !AUTH.staff.length;
        const person = {id, vorname:vn, nachname:nn, email:mail, telefon:tel, rolle, created:new Date().toISOString()};
        if(AUTH.admin || firstLocal){ await store.put("mitarbeiter", {...person, aktiv:true, freigegeben:new Date().toISOString()}); }
        else { await store.put("registrierungen", {...person, status:"offen"}); }
        sessionSet(id, true); lockReset();
        await afterLogin(id, true);
      }catch(err){ busy(f,false); authErr("Registrierung fehlgeschlagen. Bitte erneut versuchen."); console.warn(err); }
    };
  }
  if(name==="login"){
    $("#fLogin").onsubmit = async ev=>{
      ev.preventDefault(); authErr("");
      const f=ev.target, mail=normMail($("#li_mail").value), pw=$("#li_pw").value;
      const l=lockInfo(); if(l.until>Date.now()) return authErr(`Zu viele Fehlversuche. Bitte in ${Math.ceil((l.until-Date.now())/1000)} Sekunden erneut versuchen.`);
      if(!mail||!pw) return authErr("Bitte E-Mail und Passwort eintragen.");
      busy(f,true,"Anmelden …");
      try{
        const st = await startLogin(mail,pw);
        if(st==="notowner"){ busy(f,false); return authErr("Dieses Start-Login funktioniert nur für den Besitzer der App."); }
        if(st){ lockReset(); sessionSet(st, $("#li_rem").checked); AUTH.startPw=true; await afterLogin(st, true); setTimeout(()=>toast("Bitte im Profil ein eigenes Passwort festlegen."),1600); return; }
        const a = await authGet(mail);
        if(AUTH.mode==="db" && a.none){ busy(f,false); return authErr("Für dein Konto gibt es noch keine Registrierung."); }
        if(a.none || a.mismatch || !(await pwCheck(pw,a))){ lockFail(); busy(f,false); return authErr("E-Mail oder Passwort ist nicht korrekt."); }
        lockReset(); sessionSet(a.id, $("#li_rem").checked);
        await afterLogin(a.id, true);
      }catch(err){ busy(f,false); authErr("Anmeldung fehlgeschlagen. Bitte erneut versuchen."); console.warn(err); }
    };
  }
  if(name==="forgot"){
    $("#fForgot").onsubmit = async ev=>{
      ev.preventDefault(); authErr("");
      const f=ev.target, mail=normMail($("#fg_mail").value), pw=$("#fg_pw").value;
      const p=pwProblems(pw); if(!p.len||!p.num||!p.let) return authErr("Mindestens 8 Zeichen mit Zahl und Buchstabe.");
      if(pw!==$("#fg_pw2").value) return authErr("Die Passwörter stimmen nicht überein.");
      busy(f,true,"Wird gespeichert …");
      const a = await authGet(mail);
      if(a.none || a.mismatch){ busy(f,false); return authErr("Diese E-Mail ist nicht registriert."); }
      await authPut({...a, ...(await pwHash(pw))});
      lockReset(); toast("Neues Passwort gespeichert"); authScreen("login"); $("#li_mail").value=mail; $("#li_pw").focus();
    };
  }
}

function mergeDeep(base, over){
  if(Array.isArray(base)) return Array.isArray(over) ? over : base;
  if(base && typeof base==="object"){ const o={...base}; for(const k of Object.keys(over||{})) o[k] = k in base ? mergeDeep(base[k], over[k]) : over[k]; return o; }

async function toUploadable(f){
  const t=(f.type||"").toLowerCase(), n=(f.name||"").toLowerCase();
  if(t.startsWith("video/") || /\.(mp4|webm|mov|m4v)$/.test(n)){
    if(f.size>MAX_BYTES) throw {code:"too_large"};
    const type = t==="video/webm"||n.endsWith(".webm") ? "video/webm" : "video/mp4"; // MOV/M4V (H.264) wird als MP4 gespeichert
    return {blob:f, type, kind:"video"};
  }
  const ok=["image/jpeg","image/png","image/webp","image/gif"].includes(t);
  if(ok && f.size<=4*1024*1024) return {blob:f, type:t, kind:"image"};
  // Grosse Fotos oder andere Formate (z. B. HEIC): verkleinern und als JPEG speichern
  let bmp; try{ bmp=await createImageBitmap(f); }catch(e){ throw {code:"unsupported_type"}; }
  const s=Math.min(1, 2400/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas");

/* ---------- Abschleppdienst: Liste ---------- */
function filterAD(){
  const f=S.f.ad;
  const L=S.einsaetze.filter(e=>{
    if(f.dienst && e.dienst!==f.dienst) return false;
    if(f.status){ if(f.status==="_offen"){ if(["Abgeschlossen","Storniert"].includes(e.status)) return false; } else if(e.status!==f.status) return false; }
    if(f.prio && e.prio!==f.prio) return false;
    if(f.fahrer && (f.fahrer==="_none" ? !!e.fahrer : e.fahrer!==f.fahrer)) return false;
    if(f.fz && e.einsatzfz!==f.fz) return false;
    if(f.depot==="in" && !inDepot(e)) return false; if(f.depot==="out" && !e.depot?.ausfahrt) return false; if(f.depot==="nie" && e.depot) return false;
    if(!inRange(e.termin||e.created,f.von,f.bis)) return false;
    return qMatch(f.q, hay([e.nr,e.dienst,e.status,e.fz.kontrollschild,e.fz.marke,e.fz.farbe,e.fz.vin,e.auftraggeber.name,e.auftraggeber.telefon,e.ort,e.ziel,e.fp?.liegenschaft,e.fp?.parkplatz,e.fahrer,e.einsatzfz,e.notiz,e.depot?.stellplatz]));
  });
  const t=e=>new Date(e.termin||e.created);
  const so={neu:(a,b)=>t(b)-t(a), alt:(a,b)=>t(a)-t(b), betrag:(a,b)=>eAmount(b)-eAmount(a), plate:(a,b)=>(a.fz.kontrollschild||"~").localeCompare(b.fz.kontrollschild||"~")}[f.sort]||(()=>0);
  return L.sort(so);
}

  const L=filterAD(), sum=L.filter(e=>e.status!=="Storniert").reduce((s,e)=>s+eAmount(e),0);

function filterWS(){
  const f=S.f.ws;
  const L=S.orders.filter(o=>{
    if(f.status==="_aktiv"){ if(o.status==="Abgeholt") return false; } else if(f.status && o.status!==f.status) return false;

    if(f.mech && o.annahmeDurch!==f.mech && o.mech?.name!==f.mech && o.ek?.name!==f.mech) return false;
    if(f.rechnung==="ja" && !o.buch?.rechnung) return false; if(f.rechnung==="nein" && o.buch?.rechnung) return false;
    if(f.late && !isLate(o)) return false;
    if(!inRange(o.termin||o.created,f.von,f.bis)) return false;
    return qMatch(f.q, hay([o.nr,o.status,o.quelle,o.kunde.name,o.kunde.telefon,o.kunde.email,o.fz.kontrollschild,o.fz.marke,o.fz.vin,o.fz.stammnr,o.annahmeDurch,o.schluessel,...o.arbeiten.map(a=>a.text),...o.mehr.map(a=>a.text),...o.teile.map(t=>t.bez+" "+t.artnr),o.buch?.renr]));
  });
  const t=o=>new Date(o.termin||o.created);
  const so={neu:(a,b)=>t(b)-t(a), alt:(a,b)=>t(a)-t(b), betrag:(a,b)=>oAmount(b)-oAmount(a), faellig:(a,b)=>(a.fertigBis||"9").localeCompare(b.fertigBis||"9"), plate:(a,b)=>(a.fz.kontrollschild||"~").localeCompare(b.fz.kontrollschild||"~")}[f.sort]||(()=>0);

}

let XLSXP;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); return XLSXP ||= new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=()=>window.XLSX?res(window.XLSX):rej(); s.onerror=()=>{ XLSXP=null; rej(); }; document.head.append(s); }); }
async function saveXLSX(base, sheets){
  let X; try{ X=await loadXLSX(); }catch(e){ return toast("Excel-Export konnte nicht geladen werden. Bitte später erneut versuchen."); }
  const wb=X.utils.book_new();
  for(const sh of sheets){
    const ws=X.utils.aoa_to_sheet(sh.rows);
    ws["!cols"]=sh.rows[0].map((_,i)=>({wch:Math.min(45,Math.max(9,...sh.rows.slice(0,300).map(r=>String(r[i]??"").length+2)))}));
    if(sh.rows.length>1) ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:sh.rows.length-1,c:sh.rows[0].length-1}})};
    ws["!freeze"]={xSplit:0,ySplit:1};
    X.utils.book_append_sheet(wb, ws, sh.name.slice(0,31));
  }
  const blob=new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  let dl=null; try{ dl=await (window.claude?.use?claude.use("downloads"):null); }catch(e){}
  if(!dl) return toast("Download ist nur verfügbar, wenn die App in Claude geöffnet ist.");
  try{ await dl.save({filename:`${base}_${new Date().toISOString().slice(0,10)}.xlsx`, data:blob}); }
  catch(err){ if(err?.code==="extension_not_enabled") toast("Excel-Dateien sind in dieser Ansicht nicht verfügbar."); else if(err?.code!=="declined") toast("Export nicht möglich."); }
}

const kNorm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function kundeRefs(k){ const n=kNorm(k.name);

           ords:S.orders.filter(o=>o.kunde?.kundeId===k.id || (!o.kunde?.kundeId && n && kNorm(o.kunde?.name)===n)) }; }
function kStats(k){
  const r=kundeRefs(k);
  const ue=r.eins.filter(eDone).reduce((s,e)=>s+eAmount(e),0), uw=r.ords.filter(oDone).reduce((s,o)=>s+oAmount(o),0);
  const dates=[...r.eins.map(e=>e.termin||e.created),...r.ords.map(o=>o.termin||o.created)].filter(Boolean).sort();
  const fz=new Map(); [...r.eins,...r.ords].forEach(x=>{ const p=x.fz?.kontrollschild; if(p && !fz.has(normPlate(p))) fz.set(normPlate(p),{plate:p,marke:x.fz.marke}); });
  return {...r, ue, uw, total:ue+uw, n:r.eins.length+r.ords.length, last:dates.at(-1), fahrzeuge:[...fz.values()]};
}
function filterKD(){
  const f=S.f.kd;
  const L=S.kunden.filter(k=>(!f.typ||k.typ===f.typ) && qMatch(f.q, hay([k.name,k.typ,k.kontakt,k.telefon,k.email,k.adresse,k.plz,k.ort,k.notiz])));
  if(f.sort==="name") return L.sort((a,b)=>a.name.localeCompare(b.name));
  const st=new Map(L.map(k=>[k.id,kStats(k)]));
  if(f.sort==="umsatz") return L.sort((a,b)=>st.get(b.id).total-st.get(a.id).total);

}

async function kundenImport(){

}

  const topMax=Math.max(1,...top.map(x=>x.t));

  return `<div class="fbar"><span class="pill-toggle" role="group" aria-label="Zeitraum">${[["12m","Letzte 12 Monate"],["jahr","Dieses Jahr"],["alles","Gesamt"]].map(([k,l])=>`<button data-statp="${k}" aria-pressed="${S.statPeriod===k}">${l}</button>`).join("")}</span><button class="btn" data-xls="stat" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Excel</button></div>
  <div class="kpis"><div class="kpi"><b style="font-size:20px">${chf(uE+uW)}</b><span>Umsatz total</span></div><div class="kpi"><b style="font-size:20px">${chf(uE)}</b><span><i class="dot-ad"></i> Abschleppdienst · ${E.length}</span></div><div class="kpi"><b style="font-size:20px">${chf(uW)}</b><span><i class="dot-ws"></i> Werkstatt · ${W.length}</span></div><div class="kpi"><b>${S.kunden.length}</b><span>Kunden · ${neuK} neu</span></div></div>
  <div class="st-card"><h3>Umsatz pro Monat</h3>
    <div class="bars" role="img" aria-label="Umsatz pro Monat">${months.map(d=>{ const a=mE[mk(d)]||0, w=mW[mk(d)]||0; return `<div class="bar-col" title="${MONATE[d.getMonth()]} ${d.getFullYear()}: ${chf(a+w)}"><div class="bar-stack"><span class="b-ws" style="height:${w/mx*100}%"></span><span class="b-ad" style="height:${a/mx*100}%"></span></div><small>${MONATE[d.getMonth()].slice(0,3)}</small></div>`; }).join("")}</div>

  }
});
function linkKunde(target, key){ // key: "kunde" | "auftraggeber"
  const k=kundeByName(target[key]?.name);

const defPlan = () => [0,1,2,3,4].map(()=>({aktiv:true,von:"07:30",bis:"17:30",pause:60})).concat([{aktiv:false,von:"08:00",bis:"12:00",pause:0},{aktiv:false,von:"08:00",bis:"12:00",pause:0}]);

const hm = s => { const [h,m]=String(s||"0:0").split(":").map(Number); return h*60+(m||0); };
const planHours = plan => (plan||[]).reduce((s,d)=>s+(d.aktiv?Math.max(0,hm(d.bis)-hm(d.von)-(+d.pause||0)):0),0)/60;
const planOf = m => (m?.wochenplan?.length===7 ? m.wochenplan : PCFG().standardplan);

/* ---------- Feiertage (Kanton Zürich automatisch) ---------- */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
function zhFeiertage(y){ const E=easter(y), add=(d,n)=>{ const x=new Date(E); x.setDate(E.getDate()+d); return {d:dayKey(x),n}; };
  return [{d:`${y}-01-01`,n:"Neujahr"},{d:`${y}-01-02`,n:"Berchtoldstag"},add(-2,"Karfreitag"),add(1,"Ostermontag"),{d:`${y}-05-01`,n:"Tag der Arbeit"},add(39,"Auffahrt"),add(50,"Pfingstmontag"),{d:`${y}-08-01`,n:"Bundesfeier"},{d:`${y}-12-25`,n:"Weihnachten"},{d:`${y}-12-26`,n:"Stephanstag"}]; }
function feiertag(k){ const c=PCFG(), y=+k.slice(0,4); return [...(c.autoZH?zhFeiertage(y):[]), ...(c.feiertage||[])].find(f=>f.d===k); }

/* ---------- Abwesenheiten ---------- */
const abwOf = mid => S.abw.filter(a=>a.mid===mid);
const abwAm = (mid,k) => S.abw.find(a=>a.mid===mid && a.von<=k && a.bis>=k);
function werktage(von,bis,halbtag){ let n=0; for(let d=new Date(von+"T12:00"); dayKey(d)<=bis; d.setDate(d.getDate()+1)){ const wd=(d.getDay()+6)%7; if(wd<5 && !feiertag(dayKey(d))) n++; } return halbtag&&von===bis ? n*0.5 : n; }
function ferienSaldo(m, y=new Date().getFullYear()){
  const ans=+(m.ferienTage??20); const L=abwOf(m.id).filter(a=>a.typ==="Ferien" && a.von.slice(0,4)<=String(y) && a.bis.slice(0,4)>=String(y));
  const b=L.reduce((s,a)=>s+werktage(a.von<`${y}-01-01`?`${y}-01-01`:a.von, a.bis>`${y}-12-31`?`${y}-12-31`:a.bis, a.halbtag),0);
  const heute=todayKey(), bezogen=L.filter(a=>a.von<=heute).reduce((s,a)=>s+werktage(a.von<`${y}-01-01`?`${y}-01-01`:a.von, (a.bis>heute?heute:a.bis)>`${y}-12-31`?`${y}-12-31`:(a.bis>heute?heute:a.bis), a.halbtag),0);
  return {ans, geplant:b, bezogen, rest:ans-b};
}
function abwLabel(name){ const m=staffByName(name); if(!m) return null; const a=abwAm(m.id,todayKey()); return a ? a.typ : null; }

/* ---------- Provisionen ---------- */
function eZeit(e){ const l=(e.log||[]).filter(x=>/→ Unterwegs/.test(x.a)).map(x=>x.t).sort()[0]; return l || e.termin || e.created; }
function ausserhalb(m, iso){
  const d=new Date(iso), k=dayKey(d), f=feiertag(k); if(f) return `Feiertag (${f.n})`;
  const p=planOf(m)[(d.getDay()+6)%7]; if(!p?.aktiv) return (d.getDay()===0||d.getDay()===6)?"Wochenende":"Freier Tag";
  const t=d.getHours()*60+d.getMinutes(); if(t<hm(p.von)) return "Vor Arbeitsbeginn"; if(t>=hm(p.bis)) return "Nach Feierabend"; return "";
}
function provisionen(y,mo){
  const c=PCFG(), out=[];
  for(const e of S.einsaetze){
    if(!eDone(e) || !e.fahrer) continue;
    const t=eZeit(e), d=new Date(t); if(d.getFullYear()!==y || d.getMonth()!==mo) continue;
    const m=staffByName(e.fahrer); if(m && pDoc(m.id).provision===false) continue;
    const grund=ausserhalb(m,t); if(!grund) continue;
    const r=c.regeln[e.dienst]||{fix:0,proz:0}, betrag=eAmount(e), prov=(+r.fix||0)+betrag*(+r.proz||0)/100;
    out.push({e,t,grund,betrag,prov,fahrer:e.fahrer});
  }
  return out.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
}

  sh.body.addEventListener("click",e=>{ const b=e.target.closest("[data-abt]"); if(!b) return; typ=b.dataset.abt; sh.body.querySelectorAll("[data-abt]").forEach(x=>x.setAttribute("aria-checked",x===b)); });
  sh.body.addEventListener("input",info); info();
  $("#ab_ok",sh.body).onclick=async ()=>{
    const v=$("#ab_v",sh.body).value, b=$("#ab_b",sh.body).value, h=$("#ab_h",sh.body).checked&&v===b, notiz=$("#ab_n",sh.body).value.trim();

    try{
      if(antrag){
        const doc=S.antraege.find(a=>a.id===AUTH.id) || {id:AUTH.id, items:[]};
        doc.items=[...(doc.items||[]), {id:uid(), typ, von:v, bis:b, halbtag:h, notiz, status:"beantragt", created:new Date().toISOString()}];
        await store.put("antraege",doc); if(!S.antraege.includes(doc)) S.antraege.push(doc); toast("Antrag gesendet");
      } else {
        const a={id:uid(), mid: mid || $("#ab_m",sh.body).value, typ, von:v, bis:b, halbtag:h, notiz, created:new Date().toISOString(), by:fullName(AUTH.me)};
        await store.put("abwesenheiten",a); S.abw.push(a); toast("Abwesenheit gespeichert");
      }
    }catch(e){ return err("Speichern nicht möglich."); }
    sh.close(); if(document.querySelector(".sheet-bg")) myAbsenceSheet(); else render();
  };
}

function bindPersonal(){
  const v=$("#view");
  v.oninput=e=>{ const el=e.target;
    if(el.dataset.pc){ setIn(S.pcDraft, el.dataset.pc, el); S.pcDirty=true; $("#pcBar")?.classList.add("on"); if(el.dataset.pc.startsWith("standardplan")){ $("#planSum_pc").textContent=planHours(S.pcDraft.standardplan).toFixed(1)+" Stunden pro Woche"; el.closest(".plan-row")?.classList.toggle("off", el.type==="checkbox"&&!el.checked); } if(el.dataset.pc==="autoZH") refreshKeepP(); }
  };
  v.onclick=async e=>{ const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
    if(d.ptab){ if(S.pTab==="cfg" && S.pcDirty && !confirm("Ungespeicherte Regeln verwerfen?")) return; S.pcDirty=false; S.pcDraft=null; S.pTab=d.ptab; render(); return; }
    if(d.ma){ go("ma",d.ma); return; }
    if(d.provm){ const x=new Date(S.provMonth.y,S.provMonth.m+(+d.provm),1); S.provMonth={y:x.getFullYear(),m:x.getMonth()}; render(); return; }
    if(d.abwdel){ if(!confirm("Abwesenheit löschen?")) return; await store.del("abwesenheiten",d.abwdel).catch(()=>{}); S.abw=S.abw.filter(a=>a.id!==d.abwdel); render(); return; }
    if(d.antrag){ const [mid,iid,res]=d.antrag.split(":"); const doc=S.antraege.find(a=>a.id===mid), it=doc?.items.find(i=>i.id===iid); if(!it) return;
      try{ if(res==="ok"){ const a={id:uid(),mid,typ:it.typ,von:it.von,bis:it.bis,halbtag:it.halbtag,notiz:it.notiz,created:new Date().toISOString(),by:fullName(AUTH.me)}; await store.put("abwesenheiten",a); S.abw.push(a); it.status="genehmigt"; } else it.status="abgelehnt";
        await store.put("antraege",doc); toast(res==="ok"?"Antrag genehmigt":"Antrag abgelehnt"); }catch(err){ toast("Speichern nicht möglich."); } render(); return; }
    if(d.pcdel){ S.pcDraft.feiertage.splice(+d.pcdel,1); S.pcDirty=true; refreshKeepP(); return; }
    if(d.act==="pcAddF"){ (S.pcDraft.feiertage ||= []).push({d:todayKey(),n:""}); S.pcDirty=true; refreshKeepP(); return; }
    if(d.act==="pcReset"){ S.pcDraft=null; S.pcDirty=false; render(); return; }
    if(d.act==="pcSave"){ try{ await store.put("personal",{...structuredClone(S.pcDraft),id:"_config"}); }catch(err){ return toast("Speichern nicht möglich."); }
      S.personal=[...S.personal.filter(p=>p.id!=="_config"),{...structuredClone(S.pcDraft),id:"_config"}]; S.pcDirty=false; S.pcDraft=null; toast("Regeln gespeichert"); render(); return; }
    if(d.act==="abwNew"){ abwSheet(); return; }
    if(d.act==="provXls"){ exportProv(); return; }
  };
}

function bindMa(){

function exportProv(){

}

const toIntl = p => { let d=String(p||"").replace(/[^\d+]/g,""); if(d.startsWith("+")) d=d.slice(1); else if(d.startsWith("00")) d=d.slice(2); else if(d.startsWith("0")) d="41"+d.slice(1); return d; };
const firmaSig = () => [SET.firma.name||"ASZRH GmbH", SET.firma.telefon].filter(Boolean).join(", ");
const eOrt = e => isFP(e)||isPB(e) ? [e.fp.liegenschaft,e.fp.parkplatz].filter(Boolean).join(", ") : e.ort;
const depotOf = e => { const d=(CFG.depots||[]).find(x=>x.name===e.depot?.ort) || (CFG.depots||[])[0] || {name:"",adresse:"",oeffnung:""}; return e.ablauf?.abstell?.typ==="adresse" ? {name:"Abstellort", adresse:e.ablauf.abstell.adresse, oeffnung:""} : d; };
const dt = iso => { const d=new Date(iso); return {d:d.toLocaleDateString("de-CH"), t:d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}; };
const abschleppZeit = e => (e.log||[]).filter(l=>/Geladen|→ Transport/.test(l.a)).map(l=>l.t).sort()[0] || eZeit(e);

function txtHalterInfo(e){ const z=dt(abschleppZeit(e));
  return `Guten Tag\n\nIhr Fahrzeug ${e.fz.kontrollschild}${e.fz.marke?` (${e.fz.marke}${e.fz.farbe?", "+e.fz.farbe:""})`:""} wurde am ${z.d} um ${z.t} von ${eOrt(e)||"Privatgrund"} abgeschleppt, weil es unberechtigt parkiert war.\n\nDamit wir Ihnen Standort und Kosten mitteilen können, senden Sie uns bitte als Antwort:\n– ein Foto Ihres Ausweises (Vorderseite)\n– Vor- und Nachname\n– Adresse, PLZ und Ort\n– Telefonnummer und E-Mail\n\nFreundliche Grüsse\n${firmaSig()}`; }
function txtFreigabe(e){ const d=depotOf(e), C=calcE(e), bet=eAmount(e), a=e.abholer||{};
  return `Guten Tag ${[a.vorname,a.nachname].filter(Boolean).join(" ")}\n\nIhr Fahrzeug ${e.fz.kontrollschild} kann abgeholt werden:\n${d.name?d.name+"\n":""}${d.adresse}${e.depot?.stellplatz?`\nStellplatz: ${e.depot.stellplatz}`:""}${d.oeffnung?`\nÖffnungszeiten: ${d.oeffnung}`:""}\n\nZu bezahlen: ${chf(bet)}${C.stand?` (inkl. Standgebühren bis heute)`:""}${sgMode(e)==="Berechnen"&&CFG.standgebuehrTag?`\nPro weiteren Tag kommen ${chf(sgPreis(e))} Standgebühr dazu.`:""}${CFG.zahlinfo?`\n\nZahlung: ${CFG.zahlinfo}`:""}\n\nBitte bringen Sie Ihren Ausweis mit.\n\nFreundliche Grüsse\n${firmaSig()}`; }
function txtPolizei(e){ const z=dt(abschleppZeit(e)), d=depotOf(e);
  return `Meldung Abschleppung ab Privatgrund\n\nKontrollschild: ${e.fz.kontrollschild||"–"}\nMarke/Modell: ${e.fz.marke||"–"}\nFarbe: ${e.fz.farbe||"–"}\nAbgeschleppt am ${z.d} um ${z.t}\nStandort: ${eOrt(e)||"–"}\nAbgestellt: ${e.ablauf?.abstell?.typ==="adresse"?e.ablauf.abstell.adresse:[d.name,d.adresse].filter(Boolean).join(", ")||"Depot"}\nAuftraggeber: ${e.auftraggeber.name||"–"}\nEinsatz-Nr.: ${e.nr}\n\n${firmaSig()}`; }

function sendSheet(title, text, phone, email, onSent){
  const n=toIntl(phone);
  const sh=sheet(`<h3>${esc(title)}</h3>
    <div class="fld" style="margin-bottom:10px"><label for="snTel">Telefonnummer</label><input id="snTel" type="tel" value="${esc(phone||"")}" placeholder="+41 79 …"></div>
    <div class="fld"><label for="snTxt">Nachricht</label><textarea id="snTxt" rows="10">${esc(text)}</textarea></div>
    <div class="send-row"><a class="btn sig" id="snWa" target="_blank" rel="noopener">WhatsApp</a><a class="btn" id="snSms" target="_blank" rel="noopener">SMS</a>${email!==undefined?`<a class="btn" id="snMail" target="_blank" rel="noopener">E-Mail</a>`:""}<button class="btn" id="snCopy">Kopieren</button></div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">WhatsApp bzw. die SMS-App öffnet sich mit der fertigen Nachricht. Bilder kannst du dort bei Bedarf anhängen.</p>
    <div class="sheet-actions"><button class="btn primary" data-close>Fertig</button></div>`);
  const upd=()=>{ const t=$("#snTxt",sh.body).value, p=toIntl($("#snTel",sh.body).value);
    $("#snWa",sh.body).href=`https://wa.me/${p}?text=${encodeURIComponent(t)}`; $("#snSms",sh.body).href=`sms:+${p}?&body=${encodeURIComponent(t)}`;
    const m=$("#snMail",sh.body); if(m) m.href=`mailto:${encodeURIComponent(email||"")}?subject=${encodeURIComponent("Meldung Abschleppung "+(title.split("·")[1]||"").trim())}&body=${encodeURIComponent(t)}`; };
  sh.body.addEventListener("input",upd); upd();
  sh.body.addEventListener("click",e=>{ if(e.target.closest("#snWa,#snSms,#snMail")) onSent?.(e.target.closest("a").id.slice(2), $("#snTel",sh.body).value); });
  $("#snCopy",sh.body).onclick=async ()=>{ try{ await navigator.clipboard.writeText($("#snTxt",sh.body).value); toast("Nachricht kopiert"); }catch(e){ $("#snTxt",sh.body).select(); toast("Text markiert – bitte kopieren"); } onSent?.("Kopie"); };
  if(!n) setTimeout(()=>$("#snTel",sh.body).focus(),50);
  return sh;
}

/* ---------- Karten in der Einsatzakte ---------- */
function reviewCard(e){
  const z=curZ(e);
  const chk=[["Zession zugewiesen und gültig", z && zGueltig(z,e)],["Adresse / Liegenschaft", !!e.fp.liegenschaft],["Foto des falschparkierten Fahrzeugs", mediaTag(e,"Falschparker").length>0],["Kontrollschild", !!e.fz.kontrollschild],["Berechtigung für diesen Fall bestätigt", !!e.fp.berechtigung]];
  const must=chk[0][1]&&chk[1][1]&&chk[2][1];
  return `<section class="blk flow-card review"><div class="blk-h"><h3>Auftrag prüfen</h3><small>vor der Zuweisung an einen Fahrer</small></div>
    <ul class="chk">${chk.map(([l,ok])=>`<li class="${ok?"ok":""}">${ok?"✓":"○"} ${l}</li>`).join("")}</ul>
    <div class="btn-row">${!mediaTag(e,"Falschparker").length?`<button class="btn small" data-fp="fotoFP">Foto Falschparker hinzufügen</button>`:""}
    ${canReview()?`<button class="btn small primary" data-fp="review" ${must?"":"disabled"}>Geprüft – zur Zuweisung freigeben</button>`:`<span class="muted" style="font-size:13px">Wird von der Disposition geprüft.</span>`}</div>
    ${!must&&canReview()?`<p class="muted" style="font-size:12.5px;margin:8px 0 0">Zession, Adresse und Foto sind Pflicht.</p>`:""}</section>`;
}

  const s=[
    {k:"vid", t:"Video aller Schäden", d:"Einmal rund ums Fahrzeug filmen, bevor es berührt wird.", ok:mediaTag(e,"Vorschaden","video").length>0, btn:"Video aufnehmen"},
    {k:"geladen", t:"Laden, sichern und Foto", d:"Foto, auf dem man sieht, dass das Fahrzeug geladen und gesichert ist.", ok:mediaTag(e,"Geladen").length>0, btn:"Foto aufnehmen"},
    {k:"polizei", t:"Meldung an Stapo / Kapo", d:a.polizei?`${esc(a.polizei.behoerde)} · ${fmtDT(a.polizei.am)}${a.polizei.ref?" · "+esc(a.polizei.ref):""}`:"Kontrollschild, Marke, Modell, Farbe und Standort melden.", ok:!!a.polizei, btn:"Meldung machen"},
    {k:"leist", t:"Leistungen auswählen", d:fpItems(e).length?fpItems(e).map(x=>x.l+(x.q>1?" ×"+x.q:"")).join(", "):"Was wird dem Falschparker verrechnet?", ok:fpItems(e).length>0, btn:"Leistungen wählen"},
    {k:"abstell", t:"Abstellort", d:a.abstell?(a.abstell.typ==="adresse"?esc(a.abstell.adresse):esc(a.abstell.name)+(e.depot?.stellplatz?" · Platz "+esc(e.depot.stellplatz):"")):"In welches Depot oder an welche Adresse?", ok:!!a.abstell, btn:"Abstellort wählen"}];
  const cur=s.findIndex(x=>!x.ok);
  return `<section class="blk flow-card"><div class="blk-h"><h3>Ablauf vor Ort</h3>${cur<0?`<span class="status s-Rechnung">Erledigt</span>`:`<button class="linkbtn" data-fp="modeReset">Leerfahrt statt Abschleppen</button>`}</div>
    <ol class="steps-v">${s.map((x,i)=>`<li class="${x.ok?"done":i===cur?"cur":"lock"}"><span class="sn">${x.ok?"✓":i+1}</span><div><b>${x.t}</b><small>${x.d}</small>${i===cur?`<button class="btn small sig" data-fp="${x.k}">${x.btn}</button>`:x.ok&&["vid","geladen","polizei"].includes(x.k)&&cur>=0?`<button class="linkbtn" data-fp="${x.k}">${x.k==="polizei"?"Meldung erneut öffnen":"Weitere hinzufügen"}</button>`:""}</div></li>`).join("")}</ol></section>`;

function fpTop(e){
  if(!isFP(e) || e.status==="Storniert") return "";
  if(needsReview(e)) return reviewCard(e);
  if(e.fahrer && (E_STATUS.indexOf(e.status)>=1 || e.ablauf)) return ablaufCard(e);
  return "";
}

    <div class="btn-row" style="margin-top:14px"><button class="btn ${a.freigabe?"":"primary"}" data-fp="freigabe" ${complete?"":"disabled"}>${a.freigabe?"Standort und Kosten erneut senden":"Standort und Kosten freigeben"}</button>${!complete?`<span class="muted" style="font-size:12.5px;align-self:center">Name, Adresse, Telefon und Ausweis-Foto nötig.</span>`:""}</div></div>`;

/* ---------- Aktionen ---------- */
function abstellSheet(e){
  const deps=CFG.depots||[]; let sel=deps[0]?.name||"__adr";
  const sh=sheet(`<h3>Abstellort</h3><p class="sub">Wohin wurde das Fahrzeug gebracht?</p>
    <div class="tiles">${deps.map(d=>`<button class="tile" data-dep="${esc(d.name)}" aria-pressed="${d.name===sel}"><b>${esc(d.name)}</b><span>${esc(d.adresse)}</span></button>`).join("")}<button class="tile" data-dep="__adr" aria-pressed="${sel==="__adr"}"><b>Andere Adresse</b><span>Nicht in einem Depot abgestellt</span></button></div>
    <div class="fld" id="dpAdrW" style="margin-top:12px;${sel==="__adr"?"":"display:none"}"><label for="dpAdr">Adresse</label><input id="dpAdr" placeholder="Strasse, PLZ Ort"></div>
    <div class="fld" id="dpPlW" style="margin-top:12px;${sel==="__adr"?"display:none":""}"><label for="dpPl">Stellplatz</label><input id="dpPl" placeholder="z. B. D-04"></div>
    <div class="sheet-actions"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="dpOk">Einsatz abschliessen</button></div>`);
  sh.body.addEventListener("click",ev=>{ const b=ev.target.closest("[data-dep]"); if(!b) return; sel=b.dataset.dep; sh.body.querySelectorAll("[data-dep]").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#dpAdrW",sh.body).style.display=sel==="__adr"?"":"none"; $("#dpPlW",sh.body).style.display=sel==="__adr"?"none":""; });
  $("#dpOk",sh.body).onclick=()=>{
    const adr=$("#dpAdr",sh.body).value.trim(), pl=$("#dpPl",sh.body).value.trim();
    if(sel==="__adr" && !adr){ toast("Bitte die Adresse eintragen."); return; }
    const d=deps.find(x=>x.name===sel);
    e.ablauf.abstell = sel==="__adr" ? {typ:"adresse", adresse:adr} : {typ:"depot", name:d.name, adresse:d.adresse};
    e.depot = {stellplatz:pl, schluessel:"", einfahrt:nowLocal(), abholung:"", zustand:e.depot?.zustand||"", an:"", ausweis:false, zahlart:ZAHLARTEN[0], sgMode:sel==="__adr"?"Keine":"Berechnen", sgPreis:"", sgBetrag:"", ausfahrt:"", sig:"", betrag:0, ort:sel==="__adr"?adr:d.name};
    const f=e.status; e.status="Abgeschlossen"; e.closed=new Date().toISOString();
    logEv(e,`Abgestellt: ${sel==="__adr"?adr:d.name}${pl?" · Platz "+pl:""}`); logEv(e,`Status: ${f} → Abgeschlossen`);
    scheduleSave(e); sh.close(); refreshE(e); toast("Einsatz abgeschlossen – Fahrzeug im Depot");
  };
}
function polizeiSheet(e){
  const beh=(CFG.behoerden||[]).filter(b=>b.name); let bi=0;
  const sh=sendSheet("Meldung Polizei · "+(e.fz.kontrollschild||""), txtPolizei(e), beh[0]?.tel||"", beh[0]?.email||"");
  const box=document.createElement("div"); box.className="pol-box";
  box.innerHTML=`<div class="fld" style="margin-top:14px"><label>Gemeldet an</label><div class="role-grid">${(beh.length?beh:[{name:"Stadtpolizei"},{name:"Kantonspolizei"}]).map((b,i)=>`<button type="button" class="role" data-beh="${i}" aria-checked="${i===0}">${esc(b.name)}</button>`).join("")}</div></div>
    ${beh[0]?.tel?`<a class="btn small" id="polCall" href="tel:${esc(beh[0].tel.replace(/\s/g,""))}" style="margin-top:10px">Anrufen ${esc(beh[0].tel)}</a>`:""}
    <div class="fld" style="margin-top:10px"><label for="polRef">Referenz / Name Beamt/in (optional)</label><input id="polRef" value="${esc(e.ablauf?.polizei?.ref||"")}"></div>
    <button class="btn primary" id="polOk" style="margin-top:12px;width:100%">Meldung ist erfolgt</button>`;
  sh.body.querySelector(".sheet-actions").before(box);

  $("#polOk",box).onclick=()=>{ e.ablauf.polizei={behoerde:list[bi].name, am:new Date().toISOString(), ref:$("#polRef",box).value.trim(), by:fullName(AUTH.me)}; logEv(e,`Meldung an ${list[bi].name} erfolgt${e.ablauf.polizei.ref?" · "+e.ablauf.polizei.ref:""}`); scheduleSave(e); sh.close(); refreshE(e); };

function fpAuto(o){
  if(o.kind!=="einsatz" || !isFP(o) || o.ablauf?.modus!=="vor") return;
  if(mediaTag(o,"Geladen").length && E_STATUS.indexOf(o.status)<E_STATUS.indexOf("Transport")){ const f=o.status; o.status="Transport"; logEv(o,"Fahrzeug geladen und gesichert"); logEv(o,`Status: ${f} → Transport`); }
}
async function fpAction(e,k){
  e.ablauf ||= {};
  const setSt=s=>{ if(E_STATUS.indexOf(e.status)<E_STATUS.indexOf(s)){ const f=e.status; e.status=s; logEv(e,`Status: ${f} → ${s}`); } };
  if(k==="review"){ e.geprueft={am:new Date().toISOString(), by:fullName(AUTH.me)}; logEv(e,"Auftrag geprüft und zur Zuweisung freigegeben"); scheduleSave(e); refreshE(e); toast("Geprüft – jetzt Fahrer zuweisen"); return; }
  if(k==="fotoFP") return mediaAdd(e,"Falschparker");
  if(k==="modeVor"){ e.ablauf.modus="vor"; setSt("Vor Ort"); logEv(e,"Vor Ort: Fahrzeug ist da"); scheduleSave(e); refreshE(e); return; }
  if(k==="modeLeer"){ e.ablauf.modus="leer"; setSt("Vor Ort"); logEv(e,"Vor Ort: Fahrzeug nicht mehr da (Leerfahrt)"); scheduleSave(e); refreshE(e); return; }
  if(k==="modeReset"){ if(!confirm("Ablauf wechseln?")) return; e.ablauf.modus=e.ablauf.modus==="leer"?"vor":"leer"; logEv(e,`Ablauf gewechselt: ${e.ablauf.modus==="leer"?"Leerfahrt":"Abschleppen"}`); scheduleSave(e); refreshE(e); return; }
  if(k==="fotoLeer") return mediaAdd(e,"Leerfahrt");
  if(k==="leerDone"){ e.ablauf.leer=true; const f=e.status; e.status="Abgeschlossen"; e.closed=new Date().toISOString(); logEv(e,"Leerfahrt abgeschlossen"); logEv(e,`Status: ${f} → Abgeschlossen`); scheduleSave(e); refreshE(e); toast("Leerfahrt abgeschlossen"); return; }
  if(k==="vid") return mediaAdd(e,"Vorschaden");
  if(k==="geladen") return mediaAdd(e,"Geladen");
  if(k==="polizei") return polizeiSheet(e);
  if(k==="leist"){ $("#leistBlk")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(k==="abstell") return abstellSheet(e);
  if(k==="ausweis") return mediaAdd(e,"Ausweis");
  if(k==="infoHalter"){ sendSheet("Infos an Halter · "+(e.fz.kontrollschild||""), txtHalterInfo(e), e.abholer?.telefon||"", undefined, (ch,tel)=>{ if(tel && !e.abholer.telefon){ e.abholer.telefon=tel; } logEv(e,`Fahrzeuginfos an Halter gesendet (${ch})`); scheduleSave(e); }); return; }
  if(k==="freigabe"){ const a=e.abholer; if(!a.freigabe){ a.freigabe={am:new Date().toISOString(), by:fullName(AUTH.me)}; if(!e.depot.an) e.depot.an=[a.vorname,a.nachname].join(" "); logEv(e,"Standort und Kosten freigegeben"); scheduleSave(e); }
    const sh=sendSheet("Standort & Kosten · "+(e.fz.kontrollschild||""), txtFreigabe(e), a.telefon, undefined, ch=>{ logEv(e,`Standort und Kosten gesendet (${ch})`); scheduleSave(e); }); sh.onclose=()=>refreshE(e); return; }
  if(k==="kiosk") return kiosk(e);
}
document.addEventListener("click", ev=>{ const b=ev.target.closest("[data-fp]"); if(!b || S.view!=="einsatz") return; const e=curE(); if(e) fpAction(e,b.dataset.fp); });

    <div class="k-veh"><span class="plate">${esc(e.fz.kontrollschild||"")}</span><div><b>${esc(e.fz.marke||"")}</b><small>${esc(e.fz.farbe||"")}</small></div></div>
    ${pics.length?`<div class="k-pics">${pics.map(x=>`<figure><img src="${blobUrl(x.id)}" alt="${esc(x.tag)}"><figcaption>${x.tag==="Falschparker"?"Falsch parkiert":x.tag==="Geladen"?"Abgeschleppt":esc(x.tag)}</figcaption></figure>`).join("")}</div>`:""}
    <div class="k-cost"><h2>Kosten</h2><div class="money">${C.items.map(x=>`<span>${esc(x.l)}${x.q>1?" × "+x.q:""}</span><span>${chf(x.sum)}</span>`).join("")}${C.stand?`<span>Standgebühr</span><span>${chf(C.stand)}</span>`:""}${C.halter?`<span>Halterermittlung</span><span>${chf(C.halter)}</span>`:""}<span class="tot">Total</span><span class="tot">${chf(bet)}</span></div></div>
    <form id="kForm" novalidate><h2>Ihre Angaben</h2>
      <div class="grid g2"><div class="fld"><label for="kq_vn">Vorname</label><input id="kq_vn" autocomplete="given-name" required></div><div class="fld"><label for="kq_nn">Nachname</label><input id="kq_nn" autocomplete="family-name" required></div>
      <div class="fld"><label for="kq_adr">Adresse</label><input id="kq_adr" autocomplete="street-address" required></div><div class="grid g2" style="grid-template-columns:100px 1fr"><div class="fld"><label for="kq_plz">PLZ</label><input id="kq_plz" inputmode="numeric"></div><div class="fld"><label for="kq_ort">Ort</label><input id="kq_ort"></div></div>
      <div class="fld"><label for="kq_tel">Telefon</label><input id="kq_tel" type="tel" autocomplete="tel" required></div><div class="fld"><label for="kq_mail">E-Mail</label><input id="kq_mail" type="email" autocomplete="email"></div></div>
      <div class="fld" style="margin-top:12px"><label>Foto Ihres Ausweises</label><input type="file" id="kq_id" accept="image/*" capture="environment" hidden><button type="button" class="btn" id="kq_idb">Ausweis fotografieren</button><span id="kq_ids" class="muted" style="font-size:13px"></span></div>
      <label class="remember" style="margin-top:12px"><input type="checkbox" class="box" id="kq_ok"> Ich bin Halter/in dieses Fahrzeugs oder zur Abholung berechtigt. Meine Angaben sind korrekt.</label>
      <p class="auth-err" id="kErr2" role="alert"></p>
      <button class="btn sig block" type="submit">Angaben senden</button></form>
    <button class="linkbtn" id="kExit" style="margin-top:18px">Mitarbeiter: Kundenmodus beenden</button></div>`;
  document.body.append(k); document.body.classList.add("kiosk-on"); scrollTo(0,0);
  let idFile=null;
  $("#kq_idb",k).onclick=()=>$("#kq_id",k).click();
  $("#kq_id",k).onchange=ev=>{ idFile=ev.target.files[0]||null; $("#kq_ids",k).textContent=idFile?" ✓ Foto aufgenommen":""; };
  const exit=async ()=>{
    const pw=prompt("Passwort des angemeldeten Mitarbeiters, um den Kundenmodus zu beenden:"); if(pw===null) return;
    const a=await authMine(); if(a.none||a.mismatch||!(await pwCheck(pw,a))){ alert("Passwort ist nicht korrekt."); return; }
    k.remove(); document.body.classList.remove("kiosk-on"); refreshE(e);
  };
  $("#kExit",k).onclick=exit;
  $("#kForm",k).onsubmit=async ev=>{
    ev.preventDefault(); const v=id=>$("#"+id,k).value.trim(), err=m=>{ const x=$("#kErr2",k); x.textContent=m; x.classList.add("on"); };
    if(!v("kq_vn")||!v("kq_nn")||!v("kq_adr")||!v("kq_tel")) return err("Bitte Name, Adresse und Telefon ausfüllen.");
    if(!idFile) return err("Bitte ein Foto Ihres Ausweises aufnehmen.");
    if(!$("#kq_ok",k).checked) return err("Bitte die Bestätigung ankreuzen.");
    const btn=ev.target.querySelector("[type=submit]"); btn.disabled=true; btn.textContent="Wird gesendet …";
    try{ const api=await assetsApi(); if(!api) throw {code:"not_granted"}; const u=await toUploadable(idFile); const r=await api.upload(u.blob,{type:u.type});
      (e.media ||= []).push({id:r.id,type:"image",tag:"Ausweis",notiz:"Im Kundenmodus aufgenommen",size:r.sizeBytes,created:new Date().toISOString(),by:"Kunde"}); }
    catch(x){ btn.disabled=false; btn.textContent="Angaben senden"; return err(MEDIA_ERR(x?.code)); }
    Object.assign(e.abholer ||= {}, {vorname:v("kq_vn"),nachname:v("kq_nn"),adresse:v("kq_adr"),plz:v("kq_plz"),ort:v("kq_ort"),telefon:v("kq_tel"),email:v("kq_mail"),bestaetigt:new Date().toISOString(),quelle:"Kundenmodus"});
    logEv(e,`Angaben der abholenden Person erfasst (Kundenmodus): ${v("kq_vn")} ${v("kq_nn")}`); scheduleSave(e);
    k.querySelector(".kiosk-in").innerHTML=`${logoHTML("logo-sm")}<div class="state-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><h1>Vielen Dank</h1><p class="lead">Ihre Angaben sind bei uns eingegangen. Bitte geben Sie das Gerät zurück.</p><button class="btn block" id="kExit2">Mitarbeiter: Kundenmodus beenden</button>`;
    $("#kExit2",k).onclick=exit;
  };
}

/* ---------- Foto im Erfassungs-Assistenten ---------- */
S.draftFiles=[];
function wizPhotoHTML(){ return `<h3 style="font-size:17px;margin:18px 0 8px">Foto des Falschparkers <span class="muted" style="font-size:12.5px;font-weight:500">Pflicht für die Prüfung</span></h3>
  <div class="media-grid">${S.draftFiles.map((f,i)=>`<div class="media-item"><img src="${f.url}" alt=""><button class="pc-del" data-wizdel="${i}" aria-label="Foto entfernen">×</button></div>`).join("")}<button class="media-add" data-act="wizPhoto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button></div>
  <input type="file" id="wizPhotoIn" accept="image/*" multiple hidden>`; }
document.addEventListener("click", ev=>{
  if(S.view!=="wizard") return;
  if(ev.target.closest('[data-act="wizPhoto"]')){ $("#wizPhotoIn")?.click(); return; }
  const d=ev.target.closest("[data-wizdel]"); if(d){ S.draftFiles.splice(+d.dataset.wizdel,1); refreshW(); }
});
document.addEventListener("change", async ev=>{
  if(ev.target.id!=="wizPhotoIn") return;
  for(const f of ev.target.files){ const url=await new Promise(r=>{const x=new FileReader(); x.onload=()=>r(x.result); x.readAsDataURL(f);}); S.draftFiles.push({file:f,url}); }
  refreshW();
});
async function uploadDraftFiles(e){
  if(!S.draftFiles.length) return; const api=await assetsApi();
  if(!api){ toast("Fotos konnten nicht hochgeladen werden – bitte in der Einsatzakte nachholen."); S.draftFiles=[]; return; }
  let n=0; for(const f of S.draftFiles){ try{ const u=await toUploadable(f.file); const r=await api.upload(u.blob,{type:u.type}); (e.media ||= []).push({id:r.id,type:"image",tag:"Falschparker",notiz:"",size:r.sizeBytes,created:new Date().toISOString(),by:fullName(AUTH.me)}); n++; }catch(x){} }
  S.draftFiles=[]; if(n){ logEv(e,`${n} Foto${n>1?"s":""} Falschparker hochgeladen`); scheduleSave(e); }
}

/* ================= Globale Events ================= */
document.addEventListener("click", async e=>{
  const n=e.target.closest("[data-nav]"); if(n && !n.disabled){ go(n.dataset.nav); return; }
  const g=e.target.closest("[data-nav-go]"); if(g){ go(g.dataset.navGo); return; }
  const md=e.target.closest("[data-media]"); if(md){ const t=scanTarget(); if(t) mediaOpen(t,md.dataset.media); return; }
  if(e.target.closest('[data-act="mediaAdd"]')){ const t=scanTarget(); if(t) mediaAdd(t); return; }
  const cm=e.target.closest("[data-calmode]"); if(cm){ calState().mode=cm.dataset.calmode; render(); return; }
  const wd=e.target.closest("[data-weekday]"); if(wd){ const c=calState(), d=new Date(wd.dataset.weekday+"T12:00"); c.sel=wd.dataset.weekday; c.y=d.getFullYear(); c.m=d.getMonth(); go("kalender"); return; }
  const en=e.target.closest("[data-evnav]"); if(en){ const [v,id]=en.dataset.evnav.split(":"); if(v==="einsatz") S.backTo="dispo"; go(v,id); return; }
  const op=e.target.closest("[data-open]"); if(op){ go("order",op.dataset.open); return; }
  const oe=e.target.closest("[data-einsatz]"); if(oe){ go("einsatz",oe.dataset.einsatz); return; }
  const df=e.target.closest("[data-dfilter]"); if(df){ S.dfilter=df.dataset.dfilter; render(); return; }
  if(e.target.closest('[data-act="newE"]') && S.view!=="wizard"){ startWizard(); return; }
  const f=e.target.closest("[data-filter]"); if(f){ S.filter=f.dataset.filter; render(); return; }
  if(e.target.closest('[data-act="new"]') && S.view!=="order") createOrder();
});
$("#view").addEventListener("input", e=>{ if(e.target.id==="q"){ S.q=e.target.value; const p=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(p,p);} });
$("#backBtn").onclick=()=>{ if(S.view==="ma") go("personal"); else if(S.view==="kunde") go("kunden"); else if(S.view==="order") go("orders"); else if(S.view==="einsatz") go(S.backTo||"dispo"); else if(S.view==="wizard"){ if(!S.draft?.dienst || confirm("Erfassung verwerfen?")) go("dispo"); } };
async function createOrder(){
  const o=newOrder(); S.orders.push(o);
  try{ await store.put("auftraege",o); }catch(e){ toast("Auftrag konnte nicht gespeichert werden."); }
  go("order",o.id);
}

/* ================= Start ================= */
$("#meBtn").onclick=profileSheet; $("#meSide").onclick=profileSheet;
(async function(){
  await Promise.all([store.init(), ai.init()]);
  await authInit();
})();
</script>
